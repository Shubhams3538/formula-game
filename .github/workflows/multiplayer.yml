name: Multiplayer platform builds
on:
  push:
    branches: ['feat/multiplayer']
  workflow_dispatch:
  pull_request:
    paths: ['net/**', 'sim/**', 'game/**', 'Cargo.*', 'tools/package/build_multiplayer.py', '.github/workflows/multiplayer.yml']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux game dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libx11-dev libxi-dev libxrandr-dev libxkbcommon-dev libwayland-dev libvulkan-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --lib --bins --locked
      - run: cargo test -p racecraft-net --test lifecycle --locked
      - run: python tools/package/build_multiplayer.py
      - uses: actions/upload-artifact@v4
        with:
          name: multiplayer-${{ runner.os }}
          path: dist/*multiplayer*.zip
