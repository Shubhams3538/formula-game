name: Multiplayer UI preview

on:
  push:
    branches:
      - codex/multiplayer-ui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-preview:
    name: Windows game and server executables
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build game and dedicated server
        run: cargo build --release --locked -p f1-the-game -p racecraft-net --bin f1-the-game --bin racecraft-server

      - uses: actions/upload-artifact@v7
        with:
          name: multiplayer-ui-preview-windows-x86_64
          path: |
            target/release/f1-the-game.exe
            target/release/racecraft-server.exe
          compression-level: 0
          if-no-files-found: error
